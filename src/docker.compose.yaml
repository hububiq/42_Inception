services:
  nginx:
    container_name: nginx
    build: ./requirements/nginx/
    image: nginx
    restart: always
    port:
      - "443:443"
    depends_on:
      wordpress:
        condition: service_healthy
    network:
      - inception
    volumes:
      - wp_data:/var/www/html
    env.file:
      - .env
  
  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress/
    image: wordpress
    restart: always
    port:
      - ":"
    depends_on:
      - mariadb
    volumes:
      - wp_data:/var/www/html
    network:
      - inception
    env.file:
      - .env


  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb/
    image: postgres
    retart: always
    secrets:
      - db_password.txt
    volumes:
      - db_data:/var/lib/mysql
    env.file:
      - .env
    environment:
        MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
        MYSQL_PASSWORD_FILE: /run/secrets/db_password
    network:
      - inception
    secrets:
      - db_root_password
      - db_password

network:
  inception:
    driver: bridge

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/hgatarek/data/mariadb
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/hgatarek/data/wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt