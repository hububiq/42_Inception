services:
  nginx:
    container_name: nginx
    build: ./requirements/nginx/
    image: inception_nginx
    restart: always
    ports:
      - "443:443"
    depends_on:
      - "wordpress"
    networks:
      - inception
    volumes:
      - wp_data:/var/www/html
    env_file:
      - .env
  
  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress/
    image: inception_wordpress
    restart: always
    depends_on:
      - mariadb
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password


  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb/
    image: inception_mariadb
    restart: always
    volumes:
      - db_data:/var/lib/mysql
    env_file:
      - .env
    environment:
        MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
        MYSQL_PASSWORD_FILE: /run/secrets/db_password
    networks:
      - inception
    secrets:
      - db_root_password
      - db_password

networks:
  inception:
    driver: bridge

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/hgatarek/data/mariadb
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/hgatarek/data/wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt